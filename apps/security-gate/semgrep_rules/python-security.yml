rules:
  - id: security-gate-python-eval
    languages: [python]
    severity: ERROR
    message: Dynamic evaluation requires security review.
    pattern: eval(...)
  - id: security-gate-python-shell-true
    languages: [python]
    severity: ERROR
    message: Shell command execution is prohibited by this gate.
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.check_call(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)
