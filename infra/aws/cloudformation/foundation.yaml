AWSTemplateFormatVersion: 2010-09-09
Description: Shakedown ECS with RDS PostgreSQL/MySQL or TLS MongoDB replica set across three AZs
Parameters:
  Name:
    Type: String
    Default: shakedown-board
    AllowedPattern: "[a-z][a-z0-9-]{2,29}"
  AdditionalSecretArns:
    Type: CommaDelimitedList
    Default: ""
    AllowedPattern: ^$|arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+
    Description: Exact external Secrets Manager ARNs that ECS may read
  AdditionalSecretKmsKeyArns:
    Type: CommaDelimitedList
    Default: ""
    AllowedPattern: ^$|arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+
    Description: Exact customer-managed KMS key ARNs used by the additional secrets
  CreateDatabase:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
  AppPort:
    Type: Number
    Default: 8080
    MinValue: 1
    MaxValue: 65535
  DatabaseEngine:
    Type: String
    Default: postgres
    AllowedValues:
      - postgres
      - mysql
      - mongodb
  MysqlVersion:
    Type: String
    Default: 8.4.7
    AllowedPattern: 8\.4\.[0-9]+
  MongoAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  PostgresVersion:
    Type: String
    AllowedPattern: 17\.[0-9]+
  DatabaseName:
    Type: String
    Default: board_db
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]{0,63}"
  EnableMongoSnapshots:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
Conditions:
  WithAdditionalSecrets:
    Fn::Not:
      - Fn::Equals:
          - Fn::Join:
              - ""
              - Ref: AdditionalSecretArns
          - ""
  WithAdditionalKmsKeys:
    Fn::Not:
      - Fn::Equals:
          - Fn::Join:
              - ""
              - Ref: AdditionalSecretKmsKeyArns
          - ""
  WithDatabase:
    Fn::Equals:
      - Ref: CreateDatabase
      - "true"
  WithMongo:
    Fn::And:
      - Condition: WithDatabase
      - Fn::Equals:
          - Ref: DatabaseEngine
          - mongodb
  WithRds:
    Fn::And:
      - Condition: WithDatabase
      - Fn::Not:
          - Fn::Equals:
              - Ref: DatabaseEngine
              - mongodb
  WithMysql:
    Fn::Equals:
      - Ref: DatabaseEngine
      - mysql
  WithMongoSnapshots:
    Fn::And:
      - Condition: WithMongo
      - Fn::Equals:
          - Ref: EnableMongoSnapshots
          - "true"
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value:
            Ref: Name
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: Vpc
      InternetGatewayId:
        Ref: Gateway
  PublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ""
  PublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ""
  PublicC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone:
        Fn::Select:
          - 2
          - Fn::GetAZs: ""
  RouteC:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PublicRoutes
      SubnetId:
        Ref: PublicC
  PrivateA:
    Condition: WithRds
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.42.10.0/24
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ""
  PrivateB:
    Condition: WithRds
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.42.11.0/24
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ""
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId:
        Ref: PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: Gateway
  RouteA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PublicRoutes
      SubnetId:
        Ref: PublicA
  RouteB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PublicRoutes
      SubnetId:
        Ref: PublicB
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public demo HTTP entry
      VpcId:
        Ref: Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App ingress only from ALB; outbound for ECR logs and DB
      VpcId:
        Ref: Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort:
            Ref: AppPort
          ToPort:
            Ref: AppPort
          SourceSecurityGroupId:
            Ref: AlbSg
  DbSg:
    Condition: WithRds
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL only from ECS tasks
      VpcId:
        Ref: Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort:
            Fn::If:
              - WithMysql
              - 3306
              - 5432
          ToPort:
            Fn::If:
              - WithMysql
              - 3306
              - 5432
          SourceSecurityGroupId:
            Ref: AppSg
  DbSubnets:
    Condition: WithRds
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated subnets without an internet route
      SubnetIds:
        - Ref: PrivateA
        - Ref: PrivateB
  DbSecret:
    Condition: WithDatabase
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: DB password read only for managed URL synchronization
      GenerateSecretString:
        SecretStringTemplate: '{"username":"board_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\\'
  DbUrlSecret:
    Condition: WithDatabase
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Database URL refreshed by the adapter on deployment
      SecretString: "{}"
  Database:
    Condition: WithRds
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine:
        Ref: DatabaseEngine
      EngineVersion:
        Fn::If:
          - WithMysql
          - Ref: MysqlVersion
          - Ref: PostgresVersion
      DBInstanceClass: db.t3.micro
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      DBName:
        Ref: DatabaseName
      MasterUsername: board_admin
      MasterUserPassword:
        Fn::Sub: "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      DBSubnetGroupName:
        Ref: DbSubnets
      VPCSecurityGroups:
        - Ref: DbSg
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
  MongoSg:
    Condition: WithMongo
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MongoDB reachable only from application tasks; no SSH
      VpcId:
        Ref: Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 27017
          ToPort: 27017
          SourceSecurityGroupId:
            Ref: AppSg
  MongoRole:
    Condition: WithMongo
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-own-db-password
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - Ref: DbSecret
                  - Ref: MongoClusterSecret
              - Effect: Allow
                Action: secretsmanager:PutSecretValue
                Resource:
                  - Ref: DbUrlSecret
                  - Ref: MongoClusterSecret
                  - Ref: MongoCaSecret
  MongoProfile:
    Condition: WithMongo
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: MongoRole
  MongoData:
    Condition: WithMongo
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone:
        Fn::GetAtt:
          - PublicA
          - AvailabilityZone
      Size: 20
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${Name}-mongo-data-0
        - Key: ShakedownMongoBackup
          Value:
            Ref: Name
  MongoAttachment:
    Condition: WithMongo
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId:
        Ref: MongoInstance
      VolumeId:
        Ref: MongoData
  MongoReadyHandle:
    Condition: WithMongo
    Type: AWS::CloudFormation::WaitConditionHandle
  MongoReady:
    Condition: WithMongo
    Type: AWS::CloudFormation::WaitCondition
    DependsOn:
      - MongoAttachment
      - MongoAttachment2
      - MongoAttachment3
    Properties:
      Handle:
        Ref: MongoReadyHandle
      Timeout: "1800"
      Count: 1
  MongoInstance:
    Condition: WithMongo
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicRoute
      - RouteA
    Properties:
      ImageId:
        Ref: MongoAmi
      InstanceType: t3.small
      IamInstanceProfile:
        Ref: MongoProfile
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId:
            Ref: PublicA
          AssociatePublicIpAddress: true
          GroupSet:
            - Ref: MongoSg
          PrivateIpAddress: 10.42.0.50
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${Name}-mongo-0
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            # Rendered into CloudFormation UserData. Values are substituted by CloudFormation.
            set -euo pipefail
            umask 077
            node_index='0'
            volume='${MongoData}'
            region='${AWS::Region}'
            bundle_secret='${MongoClusterSecret}'
            ca_secret='${MongoCaSecret}'
            password_secret='${DbSecret}'
            url_secret='${DbUrlSecret}'
            db_name='${DatabaseName}'
            ready_handle='${MongoReadyHandle}'
            dnf install -y docker openssl
            systemctl enable --now docker
            security=/etc/shakedown-mongo
            mkdir -p "$security" /srv/mongodb
            chmod 700 "$security"
            device="/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$(echo "$volume" | tr -d '-')"
            for i in $(seq 1 120); do test -b "$device" && break; sleep 5; done
            test -b "$device"
            if ! blkid "$device"; then mkfs -t xfs "$device"; fi
            echo "UUID=$(blkid -s UUID -o value "$device") /srv/mongodb xfs defaults,nofail 0 2" >> /etc/fstab
            mount /srv/mongodb
            # Node 0 creates one cluster bundle. Replacements reuse it; credentials never enter logs.
            if [ "$node_index" = 0 ]; then
              aws secretsmanager get-secret-value --region "$region" --secret-id "$bundle_secret" --query SecretString --output text > "$security/bundle.json"
              if ! python3 -c 'import json,sys; assert "pem" in json.load(open(sys.argv[1]))' "$security/bundle.json" 2>/dev/null; then
                openssl req -x509 -newkey rsa:3072 -nodes -keyout "$security/ca.key" -out "$security/ca.pem" -days 3650 -subj '/CN=Shakedown Mongo CA' >/dev/null 2>&1
                openssl req -new -newkey rsa:3072 -nodes -keyout "$security/server.key" -out "$security/server.csr" -subj '/CN=shakedown-mongo' >/dev/null 2>&1
                printf '%s\n' 'subjectAltName=IP:10.42.0.50,IP:10.42.1.50,IP:10.42.2.50,IP:127.0.0.1,DNS:localhost' 'extendedKeyUsage=serverAuth,clientAuth' > "$security/extensions"
                openssl x509 -req -in "$security/server.csr" -CA "$security/ca.pem" -CAkey "$security/ca.key" -CAcreateserial -out "$security/server.crt" -days 365 -extfile "$security/extensions" >/dev/null 2>&1
                python3 - "$security" <<'PY'
            import json,pathlib,secrets,sys
            p=pathlib.Path(sys.argv[1]); (p/'bundle.json').write_text(json.dumps({'ca':(p/'ca.pem').read_text(),'pem':(p/'server.crt').read_text()+(p/'server.key').read_text(),'keyfile':secrets.token_urlsafe(500).replace('-','A').replace('_','B'),'adminPassword':secrets.token_hex(32)}))
            PY
                aws secretsmanager put-secret-value --region "$region" --secret-id "$bundle_secret" --secret-string "file://$security/bundle.json" >/dev/null
                # No CA signing key is persisted. Leaf renewal creates a coordinated new CA/bundle.
                rm -f "$security/ca.key" "$security/server.key" "$security/server.csr" "$security/server.crt" "$security/ca.srl"
              fi
            fi
            for i in $(seq 1 120); do
              aws secretsmanager get-secret-value --region "$region" --secret-id "$bundle_secret" --query SecretString --output text > "$security/bundle.json"
              if python3 -c 'import json,sys; assert "pem" in json.load(open(sys.argv[1]))' "$security/bundle.json" 2>/dev/null; then break; fi
              sleep 5
            done
            python3 - "$security" <<'PY'
            import json,pathlib,sys
            p=pathlib.Path(sys.argv[1]); b=json.loads((p/'bundle.json').read_text())
            for k,f in [('ca','ca.pem'),('pem','server.pem'),('keyfile','keyfile')]: (p/f).write_text(b[k])
            (p/'env').write_text('MONGO_INITDB_ROOT_USERNAME=admin\nMONGO_INITDB_ROOT_PASSWORD='+b['adminPassword']+'\n')
            PY
            rm "$security/bundle.json"
            chown 999:999 "$security/ca.pem" "$security/server.pem" "$security/keyfile"
            chmod 400 "$security/server.pem" "$security/keyfile"
            chmod 444 "$security/ca.pem"
            docker pull mongo:8.0
            docker run -d --name shakedown-mongo --restart unless-stopped --env-file "$security/env" -p 27017:27017 \
              -v /srv/mongodb:/data/db -v "$security/server.pem:/security/server.pem:ro" -v "$security/keyfile:/security/keyfile:ro" -v "$security/ca.pem:/security/ca.pem:ro" \
              mongo:8.0 --replSet shakedown --keyFile /security/keyfile --tlsMode requireTLS --tlsCertificateKeyFile /security/server.pem --tlsCAFile /security/ca.pem --tlsAllowConnectionsWithoutCertificates
            if [ "$node_index" != 0 ]; then exit 0; fi
            for i in $(seq 1 120); do
              if docker exec shakedown-mongo mongosh --quiet --tls --tlsCAFile /security/ca.pem --eval 'const a=db.getSiblingDB("admin"); if(!a.auth("admin",process.env.MONGO_INITDB_ROOT_PASSWORD))quit(1); a.runCommand({ping:1});' >/dev/null 2>&1; then break; fi
              sleep 5
            done
            # Initiate idempotently, then wait for all three authenticated TLS members.
            cat > "$security/configure.js" <<'JS'
            const a=db.getSiblingDB('admin'); a.auth('admin',process.env.MONGO_INITDB_ROOT_PASSWORD);
            try {rs.status();} catch(e) {if(e.code!==94)throw e;const r=rs.initiate({_id:'shakedown',members:[{_id:0,host:'10.42.0.50:27017',priority:2},{_id:1,host:'10.42.1.50:27017'},{_id:2,host:'10.42.2.50:27017'}]}); if(!r.ok)quit(2);}
            JS
            docker cp "$security/configure.js" shakedown-mongo:/tmp/configure.js
            for i in $(seq 1 120); do
              if docker exec shakedown-mongo mongosh --quiet --tls --tlsCAFile /security/ca.pem /tmp/configure.js >/dev/null 2>&1; then break; fi
              sleep 5
            done
            aws secretsmanager get-secret-value --region "$region" --secret-id "$password_secret" --query SecretString --output text > "$security/password.json"
            python3 - "$security" "$db_name" <<'PY'
            import json,pathlib,sys
            p=pathlib.Path(sys.argv[1]); password=json.loads((p/'password.json').read_text())['password']; name=sys.argv[2]
            (p/'app.js').write_text("const a=db.getSiblingDB('admin'); a.auth('admin',process.env.MONGO_INITDB_ROOT_PASSWORD); const s=rs.status(); if(s.members.filter(m=>m.health===1&&[1,2].includes(m.state)).length!==3)quit(2); if(!db.hello().isWritablePrimary)quit(2); const d=db.getSiblingDB("+json.dumps(name)+"); if(!d.getUser('app'))d.createUser({user:'app',pwd:"+json.dumps(password)+",roles:[{role:'readWrite',db:"+json.dumps(name)+"}]},{w:'majority'});")
            PY
            docker cp "$security/app.js" shakedown-mongo:/tmp/app.js
            for i in $(seq 1 120); do
              if docker exec shakedown-mongo mongosh --quiet --tls --tlsCAFile /security/ca.pem /tmp/app.js >/dev/null 2>&1; then
                python3 - "$security" "$db_name" <<'PY'
            import json,pathlib,sys,urllib.parse
            p=pathlib.Path(sys.argv[1]); password=json.loads((p/'password.json').read_text())['password']; name=sys.argv[2]
            (p/'url').write_text('mongodb://app:'+urllib.parse.quote(password,safe='')+'@10.42.0.50:27017,10.42.1.50:27017,10.42.2.50:27017/'+name+'?authSource='+name+'&replicaSet=shakedown&tls=true&tlsCAFile=/run/shakedown/db-ca/ca.pem&w=majority&retryWrites=true')
            PY
                aws secretsmanager put-secret-value --region "$region" --secret-id "$ca_secret" --secret-string "file://$security/ca.pem" >/dev/null
                aws secretsmanager put-secret-value --region "$region" --secret-id "$url_secret" --secret-string "file://$security/url" >/dev/null
                rm -f "$security/url" "$security/password.json" "$security/app.js"
                docker exec shakedown-mongo rm /tmp/app.js
                curl --fail --silent --show-error -X PUT -H 'Content-Type:' --data-binary '{"Status":"SUCCESS","Reason":"TLS replica set ready","UniqueId":"mongo","Data":"ready"}' "$ready_handle"
                exit 0
              fi
              sleep 5
            done
            exit 1
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName:
        Ref: Name
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
  Logs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /shakedown/${Name}
      RetentionInDays: 7
  Cluster:
    Type: AWS::ECS::Cluster
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: PublicRoute
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
        - Ref: PublicA
        - Ref: PublicB
        - Ref: PublicC
      SecurityGroups:
        - Ref: AlbSg
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Ref: Vpc
      Port:
        Ref: AppPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: "false"
        - Key: load_balancing.algorithm.type
          Value: round_robin
        - Key: deregistration_delay.timeout_seconds
          Value: "5"
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn:
            Ref: TargetGroup
  TrafficGate:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: Listener
      Priority: 1
      Conditions:
        - Field: source-ip
          SourceIpConfig:
            Values:
              - 0.0.0.0/0
              - ::/0
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: text/plain
            MessageBody: "Shakedown: deployment unavailable"
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: image-logs-secret
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource:
                  Fn::GetAtt:
                    - Repository
                    - Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - Logs
                    - Arn
              - Fn::If:
                  - WithDatabase
                  - Effect: Allow
                    Action: secretsmanager:GetSecretValue
                    Resource:
                      - Ref: DbSecret
                      - Ref: DbUrlSecret
                  - Ref: AWS::NoValue
              - Fn::If:
                  - WithAdditionalSecrets
                  - Effect: Allow
                    Action: secretsmanager:GetSecretValue
                    Resource:
                      Ref: AdditionalSecretArns
                  - Ref: AWS::NoValue
              - Fn::If:
                  - WithAdditionalKmsKeys
                  - Effect: Allow
                    Action: kms:Decrypt
                    Resource:
                      Ref: AdditionalSecretKmsKeyArns
                    Condition:
                      StringEquals:
                        kms:ViaService:
                          Fn::Sub: secretsmanager.${AWS::Region}.${AWS::URLSuffix}
                  - Ref: AWS::NoValue
              - Fn::If:
                  - WithMongo
                  - Effect: Allow
                    Action: secretsmanager:GetSecretValue
                    Resource:
                      Ref: MongoCaSecret
                  - Ref: AWS::NoValue
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
  AdapterPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Attach to the chosen adapter principal; DB secret access for URL synchronization
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - ecs:RegisterTaskDefinition
              - ecs:DescribeTaskDefinition
              - ecs:DescribeServices
              - ecs:ListTasks
              - ecs:DescribeTasks
            Resource: "*"
          - Effect: Allow
            Action:
              - ecs:CreateService
              - ecs:UpdateService
              - ecs:DeleteService
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${Cluster}/${Name}
          - Effect: Allow
            Action:
              - ecs:RunTask
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${Name}:*
            Condition:
              ArnEquals:
                ecs:cluster:
                  Fn::GetAtt:
                    - Cluster
                    - Arn
          - Effect: Allow
            Action:
