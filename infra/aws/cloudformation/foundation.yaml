    Properties:
      Description: Daily Mongo EBS crash-consistent snapshots retain seven
      State: ENABLED
      ExecutionRoleArn:
        Fn::GetAtt:
          - MongoSnapshotRole
          - Arn
      PolicyDetails:
        ResourceTypes:
          - VOLUME
        TargetTags:
          - Key: ShakedownMongoBackup
            Value:
              Ref: Name
        Schedules:
          - Name: daily
            CreateRule:
              Interval: 24
              IntervalUnit: HOURS
              Times:
                - '18:00'
            RetainRule:
              Count: 7
            CopyTags: true
