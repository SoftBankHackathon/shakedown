openapi: 3.1.0
info:
  title: Shakedown Engine API
  version: 0.1.2
  description: |
    > **상태: 통합 제안 (v0.1.2, 2026-10-09)**. 팀 리뷰 전이라 바뀔 수 있습니다.
    > 바꿀 때는 팀 채널에 먼저 공유하고, 버전과 `packages/contracts/README.md`의 변경 이력을 함께 고칩니다.

    엔진(apps/engine, 김도경)이 구현하고 대시보드(apps/web, 서동옥)가 호출하는 API.

    - 응답 형식은 `packages/contracts/src/index.ts`의 `Project`, `Deployment`와 같음
    - 실제 예시: `packages/contracts/fixtures/project.json`, `deployment-blocked-then-fixed.json`
    - 대시보드는 엔진 없이도 fixture로 동작함(mock 모드). 엔진이 이 명세대로 응답하면 그대로 연결됨
    - 엔진은 내부적으로 Target API(target.yaml)와 Shakedown API(shakedown.yaml)를 호출해 결과를 합침

    상태 확인 방식 (초안)
    - 상세 화면은 `events`(SSE)로 실시간 수신, 첫 화면 카드는 `GET /api/deployments/{id}`를 1초 간격으로 조회
    - 첫 화면도 나중에 SSE로 바뀔 수 있음
# 해커톤 내부 통신용이라 인증 없음. 공개 배포 시 토큰 인증 추가.
security: []
servers:
  - url: http://localhost:8700
    description: apps/engine (대시보드의 dev:web:live가 연결하는 주소)
paths:
  /api/health:
    get:
      operationId: health
      summary: 엔진 상태
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /api/projects:
    get:
      operationId: listProjects
      summary: 프로젝트 목록 (각 프로젝트의 최근 배포 포함)
      responses:
        "200":
          description: 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      summary: 레포 등록 + 분석
      operationId: createProject
      description: 레포를 받아 설정(포트, DB, 환경변수)을 자동으로 채우고 근거 파일을 함께 돌려줌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties:
                image_only: { type: boolean, default: false, description: "이미지 생성 전용 등록: 미지원 단일 앱 스택 허용" }
                repo: { type: string, description: "GitHub URL 또는 로컬 경로. 이미 등록된 레포면 기존 프로젝트를 돌려줌" }
                name: { type: string }
                targets:
                  type: array
                  minItems: 1
                  description: 배포 대상. 첫 번째가 기준(baseline)이고 나머지를 기준과 비교. 기본값 [local, aws]
                  items: { $ref: "./target.yaml#/components/schemas/TargetName" }
                  default: [local, aws]
      responses:
        "200":
          description: 분석된 프로젝트
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400":
          description: 지원하지 않는 레포 또는 잘못된 주소
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/projects/{project_id}:
    get:
      operationId: getProject
      summary: 프로젝트 상세
      parameters:
        - { name: project_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 프로젝트
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404":
          description: 없음
  /api/projects/{project_id}/deployments:
    post:
      operationId: deploy
      summary: Action 버튼 (One Action)
      description: Local 및 사전 구성된 AWS ECS 배포 지원. 두 대상이면 shakedown=true 필수. 한 대상의 shakedown=true는 comparison URL 필수. AWS BLOCKED 시 관리 대상 AWS 배포만 DELETE하며 traffic_blocked는 차단 확인 결과. autofix는 false만 지원. comparison은 기존 외부 환경이며 배포·삭제하지 않음. deployed는 시운전 미실행, promoted는 검사 통과이며 실제 트래픽 승격을 의미하지 않음.
      parameters:
        - { name: project_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                targets:
                  type: array
                  minItems: 1
                  maxItems: 2
                  uniqueItems: true
                  default: [local]
                  items: { type: string, enum: [local, aws] }
                shakedown: { type: boolean, default: false }
                autofix: { type: boolean, const: false, default: false }
                comparison: { $ref: "#/components/schemas/Endpoint" }
                options:
                  type: object
                  description: "대상 이름 → TargetOptions (target.yaml 참고)"
                  additionalProperties: true
      responses:
        "202":
          description: 접수된 배포
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "409":
          description: 같은 프로젝트의 배포가 이미 진행 중
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: 없는 프로젝트
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/projects/{project_id}/comparisons:
    post:
      operationId: compareExisting
      summary: 기존 두 환경에서 HTTP 시운전 (새 배포 없음)
      description: 테스트 계정·글·댓글을 작성하므로 테스트 전용 URL만 사용. 서로 다른 이름과 URL 필수. 외부 리소스를 배포하거나 삭제하지 않음.
      parameters:
        - { name: project_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseline, candidate]
              properties:
                baseline: { $ref: "#/components/schemas/Endpoint" }
                candidate: { $ref: "#/components/schemas/Endpoint" }
      responses:
        "202":
          description: 비교 접수
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "400":
          description: 잘못된 비교 요청
        "404":
          description: 없는 프로젝트
        "409":
          description: 같은 프로젝트의 작업이 진행 중
  /api/deployments:
    get:
      operationId: listDeployments
      summary: 배포 목록
      parameters:
        - { name: project_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: 최신순 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Deployment" }
  /api/deployments/{deployment_id}:
    get:
      operationId: getDeployment
      summary: 배포 전체 상태 (대상별 상태, 시운전 결과, 원인 보고서, AI 비용)
      parameters:
        - { name: deployment_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 배포
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
  /api/deployments/{deployment_id}/events:
    get:
      operationId: streamEvents
      summary: 실시간 진행 (Server-Sent Events)
      description: |
        `data:` 줄마다 JSON 이벤트 하나. `kind` 종류:
        - `stage` {status, message}: 단계 변경
        - `log` {source, line}: 로그 한 줄
        - `target` {target, status, url?}: 대상 상태 변경
        - `step` {attempt, index, status}: 시운전 단계 진행
        - `verdict` {attempt, status, summary}, `report` {attempt, headline}, `fix` {target, option, value}
        - `done` {status}: 끝 (deployed | promoted | warned | blocked | failed)
        현재 구현은 stage/log/done을 전달하며 단계별 진행은 stage 이벤트 후 전체 상태를 조회. 재연결은 현재 상태부터 시작하고 과거 이벤트 재생은 미지원.
        대시보드는 `log` 외 이벤트를 받으면 GET /api/deployments/{id}로 전체 상태를 다시 읽음.
      parameters:
        - { name: deployment_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
  /api/settings/llm:
    get:
      summary: 키를 제외한 Claude 연결 상태 조회
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    const: anthropic
                  configured:
                    type: boolean
                  model:
                    type: string
                  verified:
                    type: boolean
                  source:
                    enum:
                    - none
                    - environment
                    - memory
        '400': &id001
          description: 설정 또는 요청 오류
  /api/settings/llm/connect:
    post:
      summary: 짧은 유료 API 테스트 후 메모리에 키와 모델 적용
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
        '400': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - model
              additionalProperties: false
              properties:
                model:
                  type: string
                  minLength: 1
                  maxLength: 128
                api_key:
                  type: string
                  writeOnly: true
                  format: password
  /api/settings/llm/disconnect:
    post:
      summary: 현재 엔진의 메모리 연결 해제
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
        '400': *id001
  /api/projects/{project_id}/image-plans:
    post:
      summary: 소스 복사본과 Dockerfile 계획 생성, 빌드는 실행하지 않음
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - project_id
                - source
                - dockerfile
                - build_status
                properties:
                  id:
                    type: string
                  project_id:
                    type: string
                  source:
                    enum:
                    - existing
                    - rule
                    - ai-fallback
                  prompt_version:
                    type: string
                    const: dockerfile-fallback.v1
                  fallback_diagnostic:
                    type: object
                    required: [code, stage, message, details]
                    properties:
                      code: { type: string }
                      stage: { type: string, const: rule_generation }
                      message: { type: string }
                      details: { type: object, additionalProperties: true }
                  fallback_reason:
                    type: string
                    description: 규칙 생성 실패로 AI를 호출한 이유
                  dockerfile:
                    type: string
                  warnings:
                    type: array
                    items:
                      type: string
                  build_status:
                    const: not_built
        '400': *id001
        '404':
          description: 프로젝트 또는 계획 없음/만료
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                use_ai:
                  type: boolean
                  default: true
                runtime:
                  type: string
                  maxLength: 16
                entrypoint:
                  type: string
                  maxLength: 120
  /api/projects/{project_id}/image-plans/{plan_id}/build:
    post:
      summary: 검토한 계획으로 이미지 생성, 배포·실행은 수행하지 않음
      responses:
        '202':
          description: 성공
          content:
            application/json:
              schema:
                type: object
        '400': *id001
        '404':
          description: 프로젝트 또는 계획 없음/만료
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
  /api/image-builds/{build_id}:
    get:
      summary: 이미지 빌드 상태 조회; built는 앱 실행 성공을 의미하지 않음
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    enum:
                    - queued
                    - building
                    - built
                    - failed
                  image:
                    type: string
                  error:
                    type: string
        '400': *id001
        '404':
          description: 프로젝트 또는 계획 없음/만료
      parameters:
      - name: build_id
        in: path
        required: true
        schema:
          type: string

components:
  schemas:
    Endpoint:
      type: object
      required: [name, url]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9_-]*$", minLength: 1, maxLength: 40 }
        url: { type: string, format: uri, description: "HTTP(S) origin. 자격 증명·경로·쿼리·fragment 금지." }
    Project:
      type: object
      description: "전체 필드는 packages/contracts/src/index.ts의 Project"
      required: [id, name, repo, analysis]
      properties:
        id: { type: string }
        name: { type: string }
        repo: { type: string }
        targets:
          type: array
          description: 등록 시 고른 배포 대상 (첫 번째가 기준)
          items: { type: string }
        ports:
          type: object
          description: "대상 이름 → 포트 (로컬 대상만)"
          additionalProperties: { type: integer }
        analysis: { type: object, additionalProperties: true }
        secrets:
          type: array
          description: 비밀값은 이름만, 값은 항상 가려서 보냄
          items:
            type: object
            properties:
              name: { type: string }
              value: { type: string, example: "••••••••" }
        last_deployment: { oneOf: [{ $ref: "#/components/schemas/Deployment" }, { type: "null" }] }
    Deployment:
      type: object
      description: "전체 필드는 packages/contracts/src/index.ts의 Deployment"
      required: [id, project_id, status, targets, attempts]
      properties:
        id: { type: string }
        project_id: { type: string }
        status:
          type: string
          enum: [queued, building, deploying, shakedown, analyzing, fixing, deployed, promoted, warned, blocked, failed]
        mode: { type: string, enum: [comparison] }
        shakedown_id: { type: string }
        release_gate: { type: string, enum: [passed, review, blocked] }
        traffic_blocked: { type: boolean, description: "관리 AWS DELETE 차단 확인 시 true. 기존 외부 URL 트래픽은 차단하지 않음." }
        targets:
          type: object
          description: "대상 이름 → 상태. 기존 환경은 external(관리/배포 완료 아님), 정리 완료는 stopped, 관리 대상은 TargetDeployment 필드 사용"
          additionalProperties: true
        attempts:
          type: array
          description: "시운전 회차. 각 회차의 steps/verdict/report는 shakedown.yaml의 Shakedown과 같은 형식"
          items: { type: object, additionalProperties: true }
        timings: { type: object, additionalProperties: { type: number } }
        ai_cost: { type: object, additionalProperties: true }
    Error:
      type: object
      properties:
        detail: { type: string }
