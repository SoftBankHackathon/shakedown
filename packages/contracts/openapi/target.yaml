openapi: 3.1.0
info:
  title: Shakedown Target API
  version: 0.1.2
  description: |
    > **상태: 초안 (v0.1.2, 2026-10-09)**. 팀 리뷰 전이라 바뀔 수 있습니다.
    > 바꿀 때는 팀 채널에 먼저 공유하고, 버전과 `packages/contracts/README.md`의 변경 이력을 함께 고칩니다.

    배포 대상(인프라)이 구현하는 API. 엔진(apps/engine)이 호출합니다.

    - `local` 구현: infra/local (김태윤) — Docker + Cloudflare Tunnel
    - `aws` 구현: infra/aws (김재환) — ECS Fargate + ALB + RDS
    - `gcp` 구현: infra/gcp (김태현) — Cloud Run + Cloud SQL PostgreSQL

    흐름: 엔진이 `POST /deployments`로 배포를 요청 → 인프라는 바로 202를 돌려주고 뒤에서 배포
    → 엔진이 `GET /deployments/{id}`를 폴링 → `status=ready`가 되면 `url`로 시운전 시작.

    약속
    - `ready`는 "컨테이너가 떴다"가 아니라 **`url`로 외부에서 접속해 health_path가 200을 준다**는 뜻
    - `url`은 **공개 주소**여야 함 (로컬은 Tunnel 주소, AWS는 ALB 주소, GCP는 run.app 주소). localhost 금지
    - 비밀값(DB 비밀번호 등)은 `secret_refs`로 이름만 받고, 값은 인프라가 각자의 저장소에서 꺼냄
    - 같은 `deployment_id`로 다시 요청하면 새로 만들지 않고 기존 결과를 돌려줌(멱등)

    AWS 구현 제약 (v0.1.1 제안, 팀 통합 전)
    - 미리 생성한 프로젝트 전용 스택, PostgreSQL, replicas 1~2, sticky_sessions=false
    - 허용 ECR 저장소의 image@sha256:digest 필수. 태그를 digest로 고정하는 책임은 엔진에 있음
    - 환경변수는 SPRING_PROFILES_ACTIVE=demo,session-memory 또는 demo,session-jdbc만 허용
    - DB 접속 정보는 인프라 설정에서 주입. secret_refs는 db_password 이름만 지원
    - DELETE는 최신 배포의 ALB HTTP 403과 ECS 서비스 중지를 확인한 뒤 204
    - 이전 배포 DELETE는 현재 서비스에 영향 없음. 삭제 후 GET은 404, 로그는 조회 가능
    - 삭제된 ID 재사용, 같은 ID의 다른 요청, 동일 프로젝트 동시 변경은 409
    - 재시작 시 미완료 배포는 공개 차단 후 failed. 새 ID로 재시도

    GCP 구현 제약 (v0.1.2 제안, infra/gcp)
    - 미리 준비한 Cloud Run 서비스 1개(서울 asia-northeast3)와 Cloud SQL PostgreSQL. database.engine은 postgres만, 이름은 설정값만
    - replicas 1~2. Cloud Run 수동 스케일링(scalingMode=MANUAL, manualInstanceCount=replicas). 3 이상은 400
    - sticky_sessions=true면 Cloud Run 세션 어피니티를 켬. 보장이 아닌 best-effort(쿠키 기반. 인스턴스가 꺼지거나 바쁘면 다른 인스턴스로 감)
    - 허용 저장소(설정의 이미지 접두어)의 image@sha256:digest 필수. linux/amd64 이미지
    - 환경변수는 SPRING_PROFILES_ACTIVE=demo,session-memory 또는 demo,session-jdbc만 허용. secret_refs는 SPRING_DATASOURCE_PASSWORD=db_password만(Secret Manager에서 꺼냄)
    - 매 배포마다 schema-init(Cloud Run Job)을 실행하고 끝난 뒤 앱을 갱신. 앱은 DDL validate로 기동
    - url은 https://{서비스 이름}-{프로젝트 번호}.asia-northeast3.run.app 고정
    - DELETE는 최신 배포를 0대로 내리고 공개 주소가 4xx·5xx를 주는 것을 확인한 뒤(최대 15초) 204. 0대인 동안 공개 주소는 403이 아니라 503(Service is disabled)을 줌. 공개 권한(allUsers) 제거는 IAM 반영(보통 2분, 길면 7분 이상)을 기다리지 않고 뒤에서 하는 두 번째 잠금
    - 이전 배포 DELETE는 현재 서비스에 영향 없음. 삭제 후 GET은 404, 로그는 조회 가능
    - 로그는 Cloud Logging 읽기 한도(프로젝트당 분당 60회)를 넘으면 배포 로그만 돌려줌
    - 삭제된 ID 재사용, 같은 ID의 다른 요청, 동일 프로젝트 동시 변경은 409. 재시작 시 미완료 배포는 0대로 내린 뒤 failed

    상태 확인 방식 (초안)
    - 엔진은 `GET /deployments/{deployment_id}`를 2~3초 간격으로 조회
    - 5분 안에 `ready`가 안 되면 엔진이 실패로 처리
    - 나중에 콜백(`callback_url`) 방식으로 바뀔 수 있음. 그래도 GET 조회는 남김
# 해커톤 내부 통신용이라 인증 없음. 공개 배포 시 토큰 인증 추가.
security: []
servers:
  - url: http://localhost:9101
    description: infra/local (기본 포트 제안)
  - url: http://localhost:9102
    description: infra/aws (기본 포트 제안)
  - url: http://localhost:9103
    description: infra/gcp (기본 포트 제안)
paths:
  /health:
    get:
      summary: 인프라 서비스 상태
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, target]
                properties:
                  ok: { type: boolean }
                  target: { $ref: "#/components/schemas/TargetName" }
  /deployments:
    post:
      summary: 배포 요청 (비동기)
      operationId: createDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeployRequest" }
            example:
              deployment_id: dep_53c6f5e052
              project_id: prj_59c0ee1d86
              image: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/shakedown-board@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              port: 8080
              health_path: /
              env:
                SPRING_PROFILES_ACTIVE: demo,session-memory
              secret_refs:
                SPRING_DATASOURCE_PASSWORD: db_password
              database: { engine: postgres, name: board_db }
              options: { replicas: 2, sticky_sessions: false, tz: UTC }
      responses:
        "202":
          description: 접수됨. 상태는 GET으로 확인
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetDeployment" }
        "409":
          description: ID 충돌, 삭제된 ID 또는 프로젝트 동시 배포/정리
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: 요청 형식 오류 또는 지원하지 않는 옵션
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /deployments/{deployment_id}:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    get:
      summary: 배포 상태와 URL
      operationId: getDeployment
      responses:
        "200":
          description: 현재 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetDeployment" }
              example:
                deployment_id: dep_53c6f5e052
                target: aws
                status: ready
                url: http://demo.ap-northeast-2.elb.amazonaws.com
                instances: 2
                started_at: "2026-10-09T05:12:03Z"
                ready_at: "2026-10-09T05:13:41Z"
                info:
                  runtime: ECS Fargate
                  database: RDS PostgreSQL 17
                  timezone: UTC
        "404":
          description: 없는 배포
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: 공개 접근 차단 및 앱 배포 내리기 (DB와 로그 보존)
      operationId: deleteDeployment
      responses:
        "204": { description: 공개 차단과 앱 중지 완료. 이미 삭제된 ID도 204 }
        "502":
          description: 공개 차단 또는 AWS 정리 실패. DELETE 재시도 필요
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: 없는 배포
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /deployments/{deployment_id}/logs:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    get:
      summary: 배포·앱 로그 (원인 분석과 대시보드 표시용)
      operationId: getLogs
      parameters:
        - name: since
          in: query
          description: 이 시각 이후 로그만 (ISO 8601)
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: 로그 줄 목록
          content:
            application/json:
              schema:
                type: object
                required: [lines]
                properties:
                  lines:
                    type: array
                    items:
                      type: object
                      required: [ts, source, line]
                      properties:
                        ts: { type: string, format: date-time }
                        source: { type: string, description: "deploy | app | db" }
                        line: { type: string }
components:
  parameters:
    DeploymentId:
      name: deployment_id
      in: path
      required: true
      schema: { type: string, pattern: "^dep_[a-z0-9]+$" }
  schemas:
    TargetName:
      type: string
      description: 이번 해커톤 구현은 local, aws, gcp. 나머지는 확장 예정 (대시보드에 "예정"으로 표시)
      enum: [local, aws, onprem, gcp, azure]
    DeployRequest:
      type: object
      required: [deployment_id, project_id, image, port, health_path]
      properties:
        runtime: {$ref: '#/components/schemas/HttpRuntime'}
        deployment_id: { type: string, description: 엔진이 발급. 멱등 키로 사용 }
        project_id: { type: string }
        image:
          type: string
          description: 엔진이 한 번 빌드해 레지스트리에 올린 이미지. 모든 대상이 같은 이미지를 씀
        port: { type: integer, description: 컨테이너가 듣는 포트 }
        health_path: { type: string, default: / }
        env:
          type: object
          additionalProperties: { type: string }
          description: 비밀이 아닌 환경변수
        secret_refs:
          type: object
          additionalProperties: { type: string }
          description: "환경변수 이름 → 비밀값 이름. 값은 인프라가 자기 저장소(.env, Secrets Manager)에서 꺼냄"
        database:
          type: object
          properties:
            engine: { type: string, enum: [mysql, postgres] }
            name: { type: string }
        architecture:
          type: object
          additionalProperties: false
          required: [version, template_id]
          description: "AWS 전용 실행 카탈로그. replicas는 small=1, medium=2, large=3. Local에는 보내지 않음."
          properties:
            version: {const: aws-architecture.v1}
            template_id: {type: string, enum: [small, medium, large]}
        options: { $ref: "#/components/schemas/TargetOptions" }
    TargetOptions:
      type: object
      description: 대상이 지원하지 않는 옵션은 무시하고 `TargetDeployment.info`에 실제 값을 적음
      properties:
        replicas: { type: integer, minimum: 1, default: 1, description: 앱 인스턴스 수 }
        sticky_sessions: { type: boolean, default: false, description: 세션 고정 (지원 안 하는 대상은 무시) }
        tz: { type: string, default: UTC, description: 컨테이너 타임존 }
    TargetDeployment:
      type: object
      required: [deployment_id, target, status]
      properties:
        deployment_id: { type: string }
        target: { $ref: "#/components/schemas/TargetName" }
        status:
          type: string
          enum: [pending, deploying, ready, failed]
        url:
          type: string
          format: uri
          description: "status=ready일 때 필수. 외부에서 접속 가능한 공개 주소"
        instances: { type: integer, description: 실제로 떠 있는 앱 인스턴스 수 }
        started_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time }
        error: { type: string, description: "status=failed일 때 사람이 읽을 원인" }
        info:
          type: object
          additionalProperties: { type: string }
          description: 대시보드의 환경 비교 패널에 그대로 표시 (runtime, database, tz, sticky_sessions 등)
        commands:
          type: array
          items: { type: string }
          description: 실제로 실행한 명령. 대시보드 로그와 "클라우드 고유 기능" 설명에 사용
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }

    HttpRuntime:
      additionalProperties: false
      properties:
        version:
          const: http-runtime.v1
          default: http-runtime.v1
          title: Version
          type: string
        port:
          maximum: 65535
          minimum: 1
          title: Port
          type: integer
        health_path:
          default: /
          maxLength: 256
          pattern: ^/(?!/)[^\s?#\\]*$
          title: Health Path
          type: string
        env:
          additionalProperties:
            type: string
          maxProperties: 64
          title: Env
          type: object
        secret_refs:
          additionalProperties:
            type: string
          maxProperties: 32
          title: Secret Refs
          type: object
        database:
          $ref: '#/components/schemas/RuntimeDatabase'
        init_command:
          items:
            type: string
          maxItems: 32
          title: Init Command
          type: array
      required:
      - port
      title: HttpRuntime
      type: object
    RuntimeDatabase:
      additionalProperties: false
      properties:
        mode:
          default: none
          enum:
          - none
          - postgres
          - mysql
          - mongodb
          - external
          title: Mode
          type: string
        name:
          default: app
          pattern: ^[a-z][a-z0-9_]{0,62}$
          title: Name
          type: string
        bindings:
          additionalProperties:
            enum:
            - host
            - port
            - name
            - username
            - password
            - jdbc_url
            - postgres_url
            - mysql_url
            - mongodb_url
            type: string
          title: Bindings
          type: object
      title: RuntimeDatabase
      type: object
